---
title: Flip a coin!
---

<!DOCTYPE html>
<html lang="en">
<head>
    {% include "global-head-code.html"%}
    <link rel="stylesheet" href="/css/globalLessCSS.css"/>
    <link rel="stylesheet" href="/css/coinStyle.css"/>

    <script>
        if (localStorage.getItem('preferredCSSMode') === 'modernCSS') {
            window.location.replace('/../../modernCSS/Projects/coding_blog/coin_flip');
        }
        if (localStorage.getItem('preferredCSSMode') === 'noCSS') {
            window.location.replace('/../../noCSS/Projects/coding_blog/coin_flip');
        }
    </script>
</head>
<body>
    <div class="top_content">
        {% lessCSSBackButton "/../lessCSS/Projects/coding_projects", "Go back to Coding Projects" %}
    </div>
    <div class="centered_content">
        <div class="currentScore" id="currentScore">0</div>
    </div>
    <div style="position:relative">
        <div class="result" style="opacity: 0; position: absolute; z-index: 1; left: 0; right: 0; margin-inline: auto; width: fit-content;" id="result">🎉 Heads 🎉</div>
    </div>
    <div class="top_content" id="main-content" tabindex="-1" style="padding-left: 20vw; padding-right: 20vw; padding-bottom: 5vw; padding-top: 5rem;">
        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-face heads">H</div>
                <div class="coin-face tails">T</div>
            </div>
            <div class="goldenRays rotate" id="goldenRays"></div>
        </div>

        <div class="centered_content">
            <button class="flip-button" id="flipButton" style="border-radius:0; padding-bottom: 15px; padding-top: 15px; padding-left:50px; padding-right: 50px;">FLIP COIN</button>
        </div>
    </div>
    {% include "lessCSS-site-footer.html" %}
    <script src="/js/coinScript.js"></script>
    <script defer>
        document.body.onkeyup = function(e) {
            if (e.key == " " || e.code == "Space" || e.keyCode == 32) {
                document.getElementById("flipButton").click();
            }
            if (e.code == "Enter" || e.keyCode == 13) {
                document.getElementById("flipButton").click();
            }
        }
    </script>
</body>
</html>
